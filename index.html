<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハシゴ酒ガチャ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🍺 ハシゴ酒ガチャ</h1>
      <p>今夜の2軒目・3軒目を1タップで運まかせ決定！</p>
    </header>

    <!-- 条件入力画面 -->
    <div id="input-card" class="card">
      <form id="gacha-form">
        <div class="form-group">
          <label for="station-input">エリア・駅名指定</label>
          <input type="text" id="station-input" placeholder="例：新宿駅、渋谷、有楽町" />
          <button type="button" id="geo-btn" class="btn-location">📍 現在地を使用する</button>
          <p id="geo-status" class="geo-status-text"></p>
        </div>

        <div class="form-group">
          <label for="genre-select">ジャンル</label>
          <select id="genre-select">
            <option value="">指定なし（すべて）</option>
            <option value="G001">居酒屋</option>
            <option value="G002">ダイニングバー・バル</option>
            <option value="G012">バー・カクテル</option>
            <option value="G008">焼肉・ホルモン</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budget-select">予算目安</label>
          <select id="budget-select">
            <option value="">指定なし</option>
            <option value="B001">1,501〜2,000円</option>
            <option value="B002">2,001〜3,000円</option>
            <option value="B003">3,001〜4,000円</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">🎰 ガチャを回す！</button>
      </form>
    </div>

    <!-- スロット演出画面 -->
    <div id="slot-card" class="card hidden">
      <div class="slot-container">
        <p>お店を選定中...</p>
        <div id="slot-text" class="slot-text">🎰 ??? 🎰</div>
      </div>
    </div>

    <!-- 結果表示画面 -->
    <div id="result-card" class="card hidden">
      <span class="badge" id="res-genre">居酒屋</span>
      <h2 id="res-name">店舗名</h2>
      <p class="catch-text" id="res-catch"></p>

      <div class="img-container">
        <img id="res-img" src="" alt="店舗画像" />
      </div>

      <div class="info-list">
        <p>📍 <strong>アクセス:</strong> <span id="res-access"></span></p>
        <p>💰 <strong>予算:</strong> <span id="res-budget"></span></p>
        <div class="hours-box">
          <p>🕒 <strong>営業時間:</strong> <span id="res-hours"></span></p>
        </div>
      </div>

      <div class="btn-group">
        <a id="res-hp-link" href="#" target="_blank" class="btn-link hp-btn">🔥 ホットペッパーで詳細・予約</a>
        <a id="res-map-link" href="#" target="_blank" class="btn-link map-btn">🗺️ Googleマップでルート案内</a>
      </div>

      <div id="sub-candidates" class="sub-candidates-box hidden">
        <h3>🍺 他の候補店舗</h3>
        <ul id="candidate-list"></ul>
      </div>

      <div class="share-box">
        <p>結果をみんなに共有</p>
        <a id="share-x" href="#" target="_blank" class="btn-share x-btn">Xで投稿</a>
        <a id="share-line" href="#" target="_blank" class="btn-share line-btn">LINEで送る</a>
      </div>

      <div class="action-group">
        <button type="button" onclick="retryGacha()" class="btn-secondary">もう一度ガチャを回す 🔄</button>
        <button type="button" onclick="resetGacha()" class="btn-outline">条件を変更する ⚙️</button>
      </div>
    </div>

    <!-- SEO文章 -->
    <div class="seo-content">
      <h2>「ハシゴ酒ガチャ」で今夜の飲み屋巡りをスマートに</h2>
      <p>「2軒目はどこに行こう？」「近くで今すぐ入れる居酒屋が見つからない」そんなハシゴ酒の悩みは「ハシゴ酒ガチャ」が解決します。</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
