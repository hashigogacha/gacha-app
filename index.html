<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハシゴ酒ガチャ 🍻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🍻 ハシゴ酒ガチャ</h1>
      <p>サクッと次のお店を決める便利ツール</p>
    </header>

    <!-- 検索フォーム -->
    <main class="search-card">
      <!-- 1. 位置情報・駅名入力 -->
      <div class="form-group">
        <label for="locationInput">📍 現在地・駅名・エリア</label>
        <div class="input-with-btn">
          <input type="text" id="locationInput" placeholder="例：新宿駅、渋谷区宇田川町">
          <button type="button" id="geoBtn" class="btn-geo">🎯 現在地</button>
        </div>
      </div>

      <!-- 2. ジャンル選択 (新7グループ + 指定なし) -->
      <div class="form-group">
        <label for="genreSelect">🍽️ ジャンル</label>
        <select id="genreSelect" class="form-select">
          <option value="">✨ 指定なし（ハシゴ酒向け全14ジャンル）</option>
          <option value="G001,G003,G004,G016">🍶 居酒屋・和食・粉もの</option>
          <option value="G005,G006,G002">🍕 バル・洋食・イタリアン</option>
          <option value="G013,G007">🍜 ラーメン・中華（シメ飯）</option>
          <option value="G008">🥩 焼肉・ホルモン</option>
          <option value="G017,G009,G010">🌶️ 韓国・エスニック・アジアン</option>
          <option value="G011">🎤 カラオケ・宴会</option>
          <option value="G012">🍸 バー・ショットバー</option>
        </select>
      </div>

      <!-- 3. 禁煙・喫煙設定 -->
      <div class="form-group">
        <label>🚬 煙草（たばこ）の条件</label>
        <div class="segmented-control">
          <input type="radio" name="smoking" id="smoke_nonsmoking" value="nonsmoking" checked>
          <label for="smoke_nonsmoking">🚭 禁煙</label>

          <input type="radio" name="smoking" id="smoke_smoking" value="smoking">
          <label for="smoke_smoking">🚬 喫煙可・喫煙所あり</label>

          <input type="radio" name="smoking" id="smoke_any" value="any">
          <label for="smoke_any">指定なし</label>
        </div>
      </div>

      <!-- ガチャ実行ボタン -->
      <button id="gachaBtn" class="btn-primary-gacha">
        <span class="btn-text">🍺 ハシゴ酒ガチャを回す！</span>
      </button>
    </main>

    <!-- 結果表示エリア -->
    <section id="resultSection" class="result-section hidden">
      <!-- メイン当選カード（スロット演出対象） -->
      <div id="mainShopCard" class="main-shop-card">
        <div class="badge">🎉 本日のメインおすすめ！</div>
        <div id="mainShopContent">
          <!-- JSで動的生成 -->
        </div>
        <button id="reGachaBtn" class="btn-secondary-gacha">🎲 もう一度ガチャを回す</button>
      </div>

      <!-- その他の候補リスト (最初から上位5件表示) -->
      <div class="candidates-container">
        <h3>📋 その他の候補のお店</h3>
        <div id="candidateList" class="candidate-list">
          <!-- JSで最初に5件分レンダリング -->
        </div>

        <!-- 5件目の下に入る広告インプレッション枠 -->
        <div id="adContainer" class="ad-banner hidden">
          <p class="ad-label">スポンサーリンク</p>
          <div class="ad-content">【広告枠】ここにおすすめ情報や広告が表示されます</div>
        </div>

        <!-- 6件目以降の読み込みボタン -->
        <button id="loadMoreBtn" class="btn-more hidden">さらに候補を見る (+5件)</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
