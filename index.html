<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハシゴ酒ガチャ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🍺 ハシゴ酒ガチャ</h1>
      <p>今夜の2軒目・3軒目を1タップで運まかせ決定！</p>
    </header>

    <!-- 条件入力画面 -->
    <div id="input-card" class="card">
      <form id="gacha-form">
        <!-- 何軒目か（ボタン選択） -->
        <div class="form-group">
          <label>何軒目ですか？</label>
          <div class="step-btn-group">
            <button type="button" class="btn-step" data-value="1">1軒目<br><small>がっつり</small></button>
            <button type="button" class="btn-step active" data-value="2">2軒目<br><small>サク飲み</small></button>
            <button type="button" class="btn-step" data-value="3">3軒目〜<br><small>シメ</small></button>
          </div>
          <input type="hidden" id="step-select" value="2" />
        </div>

        <div class="form-group">
          <label for="station-input">エリア指定（駅名・住所など）</label>
          <input type="text" id="station-input" placeholder="例：竹ノ塚駅、東京都足立区竹の塚" />
          <button type="button" id="geo-btn" class="btn-location">📍 現在地を使用する</button>
          <p id="geo-status" class="geo-status-text"></p>
        </div>

        <!-- 距離選択 -->
        <div class="form-group">
          <label for="range-select">検索距離</label>
          <select id="range-select">
            <option value="100">100m以内（徒歩1〜2分）</option>
            <option value="300">300m以内（徒歩3〜4分）</option>
            <option value="500" selected>500m以内（徒歩6〜7分）</option>
            <option value="800">800m以内（徒歩10分）</option>
            <option value="1000">1km以内（徒歩12〜13分）</option>
            <option value="1500">1.5km以内（徒歩18〜19分）</option>
            <option value="3000">3km以内</option>
            <option value="">距離制限なし</option>
          </select>
        </div>

        <div class="form-group">
          <label for="genre-select">ジャンル</label>
          <select id="genre-select">
            <option value="">指定なし（すべて）</option>
            <option value="G001">居酒屋</option>
            <option value="G002">ダイニングバー・バル</option>
            <option value="G012">バー・カクテル</option>
            <option value="G013">ラーメン</option>
            <option value="G004">和食</option>
            <option value="G003">洋食・イタリアン</option>
            <option value="G008">焼肉・ホルモン</option>
            <option value="G016">中華</option>
            <option value="G017">韓国料理</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budget-select">予算目安</label>
          <select id="budget-select">
            <option value="">指定なし</option>
            <option value="B001">〜2,000円</option>
            <option value="B002">〜3,000円</option>
            <option value="B003">〜4,000円</option>
            <option value="B008">〜5,000円</option>
            <option value="B004">5,001円〜</option>
          </select>
        </div>

        <div class="form-group">
          <label for="smoking-select">禁煙・喫煙</label>
          <select id="smoking-select">
            <option value="">指定なし</option>
            <option value="0">禁煙席あり</option>
            <option value="1">喫煙席あり（喫煙可）</option>
          </select>
        </div>

        <!-- 今営業中のみ検索 -->
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="open-now-check" checked />
            今営業中のお店のみ検索
          </label>
        </div>

        <!-- 広告枠① -->
        <div class="ad-box ad-slot">
          <p>【スポンサーリンク（広告枠）】</p>
        </div>

        <button type="submit" class="btn-primary">🎰 ガチャを回す！</button>
      </form>
    </div>

    <!-- スロット演出画面 -->
    <div id="slot-card" class="card hidden">
      <div class="slot-container">
        <p>お店を選定中...</p>
        <div id="slot-text" class="slot-text">🎰 ??? 🎰</div>
      </div>
    </div>

    <!-- 結果表示画面 -->
    <div id="result-card" class="card hidden">
      <span class="badge" id="res-genre">居酒屋</span>
      <h2 id="res-name">店舗名</h2>
      <p class="catch-text" id="res-catch"></p>

      <div class="img-container">
        <img id="res-img" src="" alt="店舗画像" />
      </div>

      <div class="info-list">
        <p>📍 <strong>アクセス:</strong> <span id="res-access"></span></p>
        <p>💰 <strong>予算:</strong> <span id="res-budget"></span></p>
        <div class="hours-box">
          <p>🕒 <strong>営業時間:</strong> <span id="res-hours"></span></p>
        </div>
      </div>

      <div class="btn-group">
        <a id="res-hp-link" href="#" target="_blank" class="btn-link hp-btn">🔥 ホットペッパーで詳細・予約</a>
        <a id="res-map-link" href="#" target="_blank" class="btn-link map-btn">🗺️ Googleマップでルート案内</a>
      </div>

      <div class="action-group">
        <button type="button" onclick="retryGacha()" class="btn-secondary">もう一度ガチャを回す 🔄</button>
        <button type="button" onclick="resetGacha()" class="btn-outline">条件を変更する ⚙️</button>
      </div>

      <!-- 広告枠② -->
      <div class="ad-box ad-slot">
        <p>【スポンサーリンク（広告枠）】</p>
      </div>

      <!-- サブ候補エリア -->
      <div id="sub-candidates" class="sub-candidates-box hidden">
        <h3>🍺 他の候補店舗（もっと見る）</h3>
        <div id="candidate-list-container"></div>
        <button type="button" id="load-more-btn" onclick="loadMoreCandidates()" class="btn-load-more">さらに5件表示する 👇</button>
      </div>
    </div>

    <!-- SEO文章 -->
    <div class="seo-content">
      <h2>「ハシゴ酒ガチャ」で今夜の飲み屋巡りをスマートに</h2>
      <p>「2軒目はどこに行こう？」「近くで今すぐ入れる居酒屋が見つからない」そんなハシゴ酒の悩みは「ハシゴ酒ガチャ」が解決します。</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
