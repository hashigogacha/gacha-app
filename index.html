<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハシゴ酒ガチャ - 最高の1軒目・締め探しアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍻 ハシゴ酒ガチャ</h1>
            <p class="subtitle">今日の飲み歩きや、締めの一杯をランダムに決定！</p>
        </header>

        <main>
            <section class="search-section">
                <div class="input-group">
                    <label>📍 エリア・駅名</label>
                    <input type="text" id="area-input" placeholder="例: 北千住、新宿">
                </div>
                <div class="input-group">
                    <label>🍽️ ジャンル</label>
                    <select id="genre-input">
                        <option value="">指定なし (すべて)</option>
                        <option value="G001">居酒屋</option>
                        <option value="G013">ラーメン</option>
                        <option value="G016">中華</option>
                        <option value="G002">ダイニングバー・バル</option>
                        <option value="G004">和食</option>
                        <option value="G008">焼肉・ホルモン</option>
                    </select>
                </div>
                <div class="input-group checkbox-group">
                    <input type="checkbox" id="open-now-check">
                    <label for="open-now-check" class="checkbox-label">今営業中のお店のみ絞り込む</label>
                </div>

                <button id="gacha-button" class="btn-primary">🎲 ガチャを回す！</button>
            </section>

            <section id="result-section" class="hidden">
                <div id="kept-shop-area" class="hidden">
                    <h3>📍 1軒目 (キープ中)</h3>
                    <div id="kept-shop-card" class="shop-card kept"></div>
                </div>

                <h3>🎉 今回のガチャ結果</h3>
                <div id="main-shop-card" class="shop-card">
                    <!-- JSにて描画 -->
                </div>

                <div class="action-buttons">
                    <button id="keep-button" class="btn-secondary">🔒 1軒目キープ (次を探す)</button>
                    <button id="share-button" class="btn-share">📤 結果をシェア</button>
                </div>

                <div class="sub-candidates">
                    <h4>👀 他の候補 (タップで詳細へ)</h4>
                    <ul id="sub-shop-list"></ul>
                </div>

                <p class="disclaimer">※営業時間や定休日は急遽変更される場合があります。ご来店前に店舗へご確認ください。</p>
            </section>

            <section class="seo-content">
                <h2>ハシゴ酒ガチャとは？</h2>
                <p>「ハシゴ酒ガチャ」は、今日のお店選びに迷ったときの強い味方です！地域の飲み歩き、2軒目探しはもちろん、お酒を飲まない方の「今日の晩御飯ガチャ」や「締めの一杯（ラーメンなど）」を探すのにも最適です。何度回しても新しい発見がある重み付け抽選システムで、あなたにぴったりのお店を提案します。</p>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
